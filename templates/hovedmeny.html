{% extends "base.html" %}

{% block title %} Hovedmeny {% endblock %}

{% block content %} 

<h2> Her er Hovedmeny til skolens Kantina! </h2>
<h3> Dette er faste menyen vår: </h3>

<div class="fastmeny">
    {% for item in hovedmeny %}
        <div class="fastmeny-rad">
            <img src="{{ url_for('static', filename='img/' + item.bilde) }}" alt="{{ item.navn }}">
            <p id="item-navn">{{ item.navn }}</p>
            <p id="item-pris">{{ item.pris}}</p>
        </div>
    {% endfor %}
</div>

{% endblock %}
